<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | Recall Card</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f8f9fa;
      color: #212529;
    }

    .error-container {
      max-width: 600px;
      margin: 120px auto;
      padding: 32px;
      text-align: center;
    }

    .error-code {
      font-size: 72px;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .error-message {
      font-size: 24px;
      margin-bottom: 12px;
    }

    .error-description {
      color: #6c757d;
      margin-bottom: 32px;
    }

    .back-link {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 6px;
      background: #0d6efd;
      color: white;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="error-container">
    <div class="error-code">404</div>

    <h1 class="error-message">
      ページが見つかりません
    </h1>

    <p class="error-description">
      URLが間違っているか、ページが削除された可能性があります。
    </p>

    <a href="/" class="back-link">
      トップページへ戻る
    </a>
  </main>
</body>
</html>
